[project]
name = "tyche"
version = "0.0.1"
description = "Tyche: an event-driven, agent-assisted trading framework."
readme = "README.md"
authors = [{ name = "jpra0204" }]
requires-python = ">=3.14"
# Runtime dependencies are added in the phase that first uses them, so the
# lockfile only ever contains what the code actually imports. See ADR-0002.
dependencies = [
    "exchange-calendars>=4.13.3",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
    "yfinance>=1.8.0",
]

[project.scripts]
tyche = "tyche.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# --- Ruff: lint + format ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes
    "I",           # import sorting
    "N",           # naming
    "UP",          # modern Python idioms
    "B",           # likely bugs
    "SIM",         # simplifications
    "C4",          # comprehensions
    "PT",          # pytest style
    "PTH",         # pathlib over os.path
    "DTZ",         # no naive datetimes: every timestamp in Tyche is timezone-aware
    "TID",         # tidy imports
    "RUF",         # ruff-specific
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all" # absolute imports only, so the layer of every import is visible

# --- mypy: strict everywhere -------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# exchange_calendars ships no type information. Its values are typed as Any, and the
# adapter converts every one of them to our own types before it leaves the module.
[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

# yfinance ships no type information either. Only tyche.adapters.data.yfinance_source
# imports it, and that module turns every value into our own types straight away.
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not ibkr_paper and not network"]
markers = [
    "ibkr_paper: opt-in integration test against an IBKR PAPER account (never live); run with -m ibkr_paper",
    "network: opt-in test that calls a real external service, such as Yahoo Finance; run with -m network",
]
# Every warning fails the test run, so a new one is dealt with instead of scrolling past.
# Each exception below names its source and the condition for removing it.
filterwarnings = [
    "error",
    # Raised inside exchange_calendars 4.13.3 (ExchangeCalendar.__init__ reads
    # schedule.open.values) under pandas 3.1. Not our code; the values are still correct,
    # and tests/adapters/calendars pins exact UTC session times, so a real breakage would
    # fail there. Remove once an exchange_calendars release stops triggering it.
    "ignore:Series.values returning an ndarray that drops timezone information:pandas.errors.Pandas4Warning",
]

[tool.coverage.run]
source = ["tyche"]
branch = true

# --- import-linter: the architecture, enforced in CI --------------------------
# See docs/adr/0004-hexagonal-architecture.md and docs/developer-guide/repo-map.md.
[tool.importlinter]
root_package = "tyche"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Outer layers depend inward, never the reverse"
type = "layers"
layers = [
    "tyche.cli",
    "tyche.runtime",
    "tyche.adapters | tyche.strategies | tyche.config",
    "tyche.core",
]

[[tool.importlinter.contracts]]
name = "Inside the core, dependencies point toward the domain"
type = "layers"
layers = [
    "tyche.core.agents",
    "tyche.core.improvement",
    "tyche.core.backtest",
    "tyche.core.engine | tyche.core.sim",
    "tyche.core.pipeline | tyche.core.risk",
    "tyche.core.ports",
    "tyche.core.events",
    "tyche.core.domain",
]

[[tool.importlinter.contracts]]
name = "The core never imports a vendor or I/O library"
type = "forbidden"
source_modules = ["tyche.core"]
forbidden_modules = [
    "ib_async",
    "ccxt",
    "yfinance",
    "exchange_calendars",
    "httpx",
    "requests",
    "sqlite3",
    "duckdb",
    "pyarrow",
    "apscheduler",
    "subprocess",
]

[[tool.importlinter.contracts]]
name = "No LLM code in the trading path"
type = "forbidden"
source_modules = [
    "tyche.core.pipeline",
    "tyche.core.risk",
    "tyche.core.engine",
    "tyche.core.sim",
    "tyche.strategies",
]
forbidden_modules = ["tyche.core.agents", "tyche.adapters.llm"]

[[tool.importlinter.contracts]]
name = "Strategies cannot reach risk, execution, the engine or any port"
type = "forbidden"
source_modules = ["tyche.strategies"]
forbidden_modules = [
    "tyche.core.risk",
    "tyche.core.engine",
    "tyche.core.sim",
    "tyche.core.ports",
    "tyche.core.pipeline.execution",
]

# Tyche workspace configuration.
#
# Every key is validated when Tyche starts. An unknown key, a missing key or a value of
# the wrong type stops Tyche with a message naming this file and the key.

# Version of this file's format. Tyche refuses a version it does not understand.
schema_version = 1

# The market profile to trade and backtest. It must match a file in config/markets/.
market_profile = "US"

[strategies]
# The strategies to run, each with its budget: the fraction of account equity it may
# use. Budgets are above 0 and at most 1, and add up to at most 1; the rest is cash.
# Each name needs a file config/strategies/<name>.toml. Decimals are strings so they
# stay exact.
buy_and_hold = "1.0"
# Two example strategies ship with their files but no budget, so they do not run. To
# try one, give it a budget and lower the others so the total stays at most 1, e.g.:
#   buy_and_hold = "0.5"
#   trend_rotation = "0.5"
# They exist to exercise Tyche, not to make money (ADR-0027).

[backtest]
# The holdout: the most recent history, kept away from every backtest until the final
# check before a strategy is promoted (ADR-0024). A backtest that reaches this date is
# refused. It is a fixed date, so the holdout grows as time passes. Never move it
# later: history that a backtest has seen cannot become a holdout again.
holdout_starts = 2024-01-01

# The cash every backtest starts with, settled, in the profile's currency (USD for
# the US profile). Costs weigh more on a small account, so use the amount you would
# really trade with.
starting_cash = "10000"

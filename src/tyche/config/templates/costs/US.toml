# Trading costs for the US market profile: IBKR Pro Fixed, US stocks and ETFs.
#
# The file name, without .toml, must equal the market profile's name.
# Every rate below was checked against IBKR Canada's published pricing on `checked_on`.
# Sources and the full rules: docs/developer-guide/ibkr-canada-costs-and-settlement.md
# in the Tyche repository. Re-check before paper trading and before going live.
#
# Decimals are written as strings, such as "0.005", so that they stay exact: TOML reads
# 0.005 without quotes as a binary floating-point number, which Tyche refuses.

# When the rates below were last checked against the broker's published schedule.
checked_on = 2026-11-17

# Currency the commission and fees are charged in.
currency = "USD"

# Sessions between a trade and its settlement. US stocks settle T+1. In a cash account
# sale proceeds cannot be spent until they settle (ADR-0020).
settlement_days = 1

# How far a simulated fill moves against the order, in basis points of the reference
# price (5 = 0.05%). An assumption, not a broker fact; reports state the value used.
slippage_bps = "5"

[commission]
# IBKR Pro Fixed: min(max(per_share x shares, minimum), maximum_rate x trade value).
per_share = "0.005"
minimum = "1.00"
maximum_rate = "0.01"

[regulatory_fees]
# SEC transaction fee, as a fraction of the value of each sale.
sec_fee_rate = "0.0000206"
# FINRA Trading Activity Fee, per share sold: USD 0.000195 for trades in 2027 and 2028
# (SR-FINRA-2026-020, read 2026-11-23). It was paused for trades from 2026-10-01 to
# 2026-12-31; a backtest applies one rate to all its history, and the normal rate is
# the better figure for it (ADR-0041). The cap of USD 9.79 a trade is not modelled: it
# binds only above about 50,000 shares sold at once.
taf_per_share_sold = "0.000195"
# FINRA Consolidated Audit Trail fees, per share, on buys and sells.
cat_per_share = "0.000003"

[tiered]
# IBKR Pro Tiered, first volume tier (up to 300,000 shares a month), checked on
# `checked_on` like the rest of this file. Backtests never use it: they use
# [commission] above. `tyche capital` runs every amount under both plans, so you can
# choose the plan for the real account (ADR-0031). Delete this table to compare nothing.
#
# commission = min(max(per_share x shares, minimum), maximum_rate x trade value)
per_share = "0.0035"
minimum = "0.35"
maximum_rate = "0.01"
# NSCC and DTC clearing fees: per share, at most clearing_maximum_rate x trade value.
clearing_per_share = "0.0002"
clearing_maximum_rate = "0.005"
# Pass-through fees, as fractions of the commission.
nyse_pass_through_rate = "0.000175"
finra_pass_through_rate = "0.000563"
# An assumption, not a published fee: exchange fees depend on where an order executes
# and whether it removes or adds liquidity, known only after the fact. 0.0030 is what
# NYSE Arca and Nasdaq charged per share to remove liquidity (shares of USD 1 or more)
# when checked; their opening auctions charged 0.0015. The higher figure overstates
# the cost of Tyche's orders at the open rather than understating it.
exchange_fee_per_share = "0.0030"

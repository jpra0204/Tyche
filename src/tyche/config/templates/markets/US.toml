# Market profile: US stocks and ETFs, with USD cash.
#
# The file name, without .toml, must equal `name`.

name = "US"

# Currencies the account holds cash in under this profile.
cash_currencies = ["USD"]

# Trading calendars of the profile's markets, as market identifier codes.
# XNYS covers every US exchange, including NASDAQ and NYSE Arca.
calendars = ["XNYS"]

[universe]
# What an instrument must look like to be traded under this profile. The thresholds
# are choices, not market facts: they keep out shares whose prices cannot be trusted
# or traded at a fair price. Decimals are written as strings so they stay exact.

# Kinds of instrument allowed: "stock", "etf" or both.
asset_classes = ["stock", "etf"]

# Currency of the two thresholds below. Only instruments quoted in it are eligible.
currency = "USD"

# Lowest last close allowed. Prices are split-adjusted, so before a split they read
# lower than what traded at the time; this errs on the side of leaving a share out.
min_price = "5.00"

# Lowest average of close x volume over the last `liquidity_sessions` bars.
min_average_dollar_volume = "10000000"

# Bars the liquidity average needs. An instrument with fewer bars is left out.
liquidity_sessions = 20

# Decision cycles an instrument stays out after a data problem is reported about it
# (a missing session, conflicting or invalid bars, a suspect price move).
quality_sessions = 5

# The candidates: every instrument Tyche follows under this profile. A backtest replays
# exactly these (fetch them first with `tyche data fetch`); the rules above decide at
# each decision which are eligible. A strategy can only trade an instrument listed here.
# The exchange is where it is listed, as a market identifier code: ARCX, XNAS, XNYS,
# BATS or XASE.
#
# The nine ETFs below span US large and small caps, developed and emerging markets
# outside the US, Treasuries, gold and real estate: what the example trend rotation
# chooses from (config/strategies/trend_rotation.toml). Listing exchanges checked on
# Yahoo Finance on 2026-11-19.
instruments = [
    { symbol = "SPY", exchange = "ARCX", asset_class = "etf" }, # US large caps (S&P 500)
    { symbol = "QQQ", exchange = "XNAS", asset_class = "etf" }, # US large caps (Nasdaq-100)
    { symbol = "IWM", exchange = "ARCX", asset_class = "etf" }, # US small caps (Russell 2000)
    { symbol = "EFA", exchange = "ARCX", asset_class = "etf" }, # developed markets outside North America
    { symbol = "EEM", exchange = "ARCX", asset_class = "etf" }, # emerging markets
    { symbol = "TLT", exchange = "XNAS", asset_class = "etf" }, # US Treasuries, 20+ years
    { symbol = "IEF", exchange = "XNAS", asset_class = "etf" }, # US Treasuries, 7-10 years
    { symbol = "GLD", exchange = "ARCX", asset_class = "etf" }, # gold
    { symbol = "VNQ", exchange = "ARCX", asset_class = "etf" }, # US real estate (REITs)
]

[execution]
# How approved weights become orders (ADR-0023). A choice, not a market fact.

# How far a held position may drift from its target before it is resized, as a
# fraction of the target ("0.10" is 10%). A resize pays at least the minimum
# commission, so a small drift costs less than fixing it. Entries and full exits always
# trade. "0" trades to the exact target at every decision. Reports state the value.
rebalance_band = "0.10"

# How far above the last close the next open may be and the cycle's purchases still be
# paid for ("0.02" is 2%). Orders are sized at the close and fill at the next open; a
# purchase settled cash cannot pay for at the open is cancelled whole, as the broker
# would reject it. Binds only when cash is short, so a fully invested strategy holds
# about this fraction in cash. Reports state the value.
price_buffer = "0.02"

[benchmark]
# What every strategy is measured against: this ETF's total return, dividends
# reinvested at the ex-date close, with no costs and no cash (ADR-0025). It is the
# return of simply holding it. It need not be one of the candidates above, but its
# history must be fetched like theirs.
symbol = "SPY"
exchange = "ARCX"
asset_class = "etf"
